services:
  postgres:
    image: postgres:16
    container_name: health_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
#      TZ: Asia/Dhaka
#    command:
#      - postgres
#      - -c
#      - timezone=Asia/Dhaka
    ports:
      - "5433:5432"
    volumes:
      - health_pg_data:/var/lib/postgresql/data

volumes:
  health_pg_data:

spring:
  application:
    name: health_tracker

  datasource:
    url: jdbc:postgresql://localhost:5433/health_tracker
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
